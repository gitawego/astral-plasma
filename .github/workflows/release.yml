name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        default: 'patch'
        options:
          - current
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (only if release_type is "custom", e.g. 0.2.0)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Publish as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version, bump files, and create tag
        id: meta
        run: |
          # 1. Read current version from daemon/Cargo.toml
          CURRENT_VERSION=$(grep -m1 '^version' daemon/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "[*] Current Cargo version: ${CURRENT_VERSION}"

          # 2. Determine target version and tag
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            DRAFT="false"
            PRERELEASE="false"
          else
            RELEASE_TYPE="${{ github.event.inputs.release_type }}"
            CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"
            DRAFT="${{ github.event.inputs.draft }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            case "$RELEASE_TYPE" in
              current)
                VERSION="${CURRENT_VERSION}"
                ;;
              patch)
                PATCH=$((PATCH + 1))
                VERSION="${MAJOR}.${MINOR}.${PATCH}"
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                VERSION="${MAJOR}.${MINOR}.${PATCH}"
                ;;
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                VERSION="${MAJOR}.${MINOR}.${PATCH}"
                ;;
              custom)
                if [ -z "$CUSTOM_VERSION" ]; then
                  echo "[!] Error: custom_version is required when release_type is 'custom'"
                  exit 1
                fi
                VERSION="${CUSTOM_VERSION#v}"
                ;;
              *)
                echo "[!] Unknown release_type: ${RELEASE_TYPE}"
                exit 1
                ;;
            esac

            TAG="v${VERSION}"
          fi

          echo "[*] Target Version: ${VERSION} (Tag: ${TAG})"

          # 4. A release must say what changed, in words a user can read.
          #    The updater ships these lines to every installed shell, so a tag
          #    without an authored summary - or one that disagrees with the tag -
          #    stops here instead of publishing an empty "what's new".
          NOTES="docs/releases/${VERSION}.json"
          if [ ! -f "$NOTES" ]; then
            echo "[!] Missing ${NOTES}: every release needs an authored summary."
            exit 1
          fi
          python3 - "$NOTES" "$VERSION" <<'PY'
          import json, sys
          path, version = sys.argv[1], sys.argv[2]
          try:
              data = json.load(open(path))
          except Exception as exc:
              print(f"[!] {path} is not valid JSON: {exc}")
              sys.exit(1)
          if data.get("version") != version:
              print(f"[!] {path} says version {data.get('version')!r}, tag says {version!r}")
              sys.exit(1)
          highlights = data.get("highlights")
          if not isinstance(highlights, list) or not highlights:
              print(f"[!] {path} needs at least one entry in 'highlights'. An empty "
                    f"release must say so deliberately, not by omission.")
              sys.exit(1)
          print(f"[✓] Release notes found: {len(highlights)} highlight(s)")
          PY

          # 5. Automatically update version in daemon/Cargo.toml and commit if changed
          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            echo "[*] Updating daemon/Cargo.toml: ${CURRENT_VERSION} -> ${VERSION}..."
            sed -i -E "s/^version = \".*\"/version = \"${VERSION}\"/" daemon/Cargo.toml

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add daemon/Cargo.toml
            if [ -f daemon/Cargo.lock ]; then
              git add daemon/Cargo.lock 2>/dev/null || true
            fi

            git commit -m "chore(release): bump version to ${TAG} [skip ci]"
            git push origin "${GITHUB_REF_NAME}"
            echo "[✓] Pushed version update commit to ${GITHUB_REF_NAME}"
          fi

          # 4. Create or update tag to point to HEAD
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "[*] Creating tag ${TAG}..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "[✓] Pushed tag ${TAG} to origin"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "[*] Updating tag ${TAG} to current commit..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -fa "$TAG" -m "Release $TAG"
            git push origin "$TAG" --force
            echo "[✓] Force-pushed tag ${TAG} to origin"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        run: |
          chmod +x scripts/generate_changelog.sh
          ./scripts/generate_changelog.sh "" "${{ steps.meta.outputs.tag }}" > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG_RELEASE.md

  build:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            os: ubuntu-latest
            strip_cmd: strip
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            os: ubuntu-24.04-arm
            strip_cmd: strip
    steps:
      - name: Checkout repository at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev || sudo apt-get install -y pkg-config libasound2t64-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            daemon/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.target }}-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.target }}-

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path daemon/Cargo.toml

      - name: Strip & package artifacts
        run: |
          BIN_SRC="daemon/target/${{ matrix.target }}/release/astral-plasma"
          ${{ matrix.strip_cmd }} "$BIN_SRC"

          mkdir -p dist

          # 1. Raw standalone executable
          cp "$BIN_SRC" "dist/astral-plasma-linux-${{ matrix.arch }}"
          chmod +x "dist/astral-plasma-linux-${{ matrix.arch }}"

          # 2. Complete distribution archive
          PKG_NAME="astral-plasma-${{ needs.prepare.outputs.tag }}-linux-${{ matrix.arch }}"
          mkdir -p "${PKG_NAME}/bin"
          cp "$BIN_SRC" "${PKG_NAME}/bin/astral-plasma"
          cp README.md LICENSE DESIGN.md install.sh uninstall.sh "${PKG_NAME}/"
          tar -czvf "dist/${PKG_NAME}.tar.gz" "${PKG_NAME}"

          # 3. Checksums for this architecture
          cd dist
          sha256sum "${PKG_NAME}.tar.gz" "astral-plasma-linux-${{ matrix.arch }}" > "checksums-${{ matrix.arch }}.txt"
          cat "checksums-${{ matrix.arch }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download changelog artifact
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: downloaded_artifacts

      - name: Consolidate distribution assets & checksums
        run: |
          mkdir -p release_assets
          find downloaded_artifacts -type f \( -name "*.tar.gz" -o -name "astral-plasma-linux-*" \) -exec cp {} release_assets/ \;
          
          # Consolidate checksums
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          echo "=== SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Generate update manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          # Optional: when the release key exists, its secret key is stored as a
          # repository secret and every manifest is signed. Without it the
          # manifest is published unsigned and the daemon verifies nothing.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # The daemon reads exactly one document to decide whether an update
          # exists. Generating it here keeps the version, the per-arch hashes and
          # the user-facing highlights in one place that cannot drift from the
          # artifacts it points at.
          python3 - <<'PY'
          import hashlib, json, os, sys
          from datetime import datetime, timezone

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          notes = json.load(open(f"docs/releases/{version}.json"))

          artifacts = {}
          for arch in ("x86_64", "aarch64"):
              name = f"astral-plasma-linux-{arch}"
              path = os.path.join("release_assets", name)
              if not os.path.isfile(path):
                  print(f"[!] Missing release artifact {name}; refusing to publish a manifest "
                        f"that would fail on one architecture.")
                  sys.exit(1)
              data = open(path, "rb").read()
              artifacts[arch] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              }

          manifest = {
              "schema": 1,
              "version": version,
              "channel": "stable",
              "published_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "min_quickshell": "0.3.0",
              "highlights": notes.get("highlights", []),
              "changelog": f"https://github.com/{repo}/releases/tag/{tag}",
              "artifacts": artifacts,
              "signature": None,
          }
          with open("release_assets/latest.json", "w") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

          if [ -n "${MINISIGN_SECRET_KEY:-}" ]; then
            key_file="${RUNNER_TEMP}/astral-plasma.minisign.key"
            printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key_file"
            chmod 600 "$key_file"
            bash scripts/astral-sign.sh release_assets/latest.json "$key_file"
            rm -f "$key_file"
          else
            echo "::warning::Release manifest is unsigned (MINISIGN_SECRET_KEY is not configured)."
          fi

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_DRAFT: ${{ needs.prepare.outputs.draft }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          FLAGS=""
          if [ "$IS_DRAFT" = "true" ]; then
            FLAGS="$FLAGS --draft"
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            FLAGS="$FLAGS --prerelease"
          fi

          echo "[*] Creating GitHub Release for $TAG..."
          gh release create "$TAG" \
            --title "Astral Plasma $TAG" \
            --notes-file CHANGELOG_RELEASE.md \
            $FLAGS \
            release_assets/* || {
              echo "[!] Release may already exist, uploading assets to existing release..."
              gh release upload "$TAG" --clobber release_assets/*
            }

          echo "[✓] Release $TAG published successfully!"
