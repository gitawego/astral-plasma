name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Rust Tests & Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install aarch64 cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Cache cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            daemon/target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      - name: Run Rust unit tests
        run: |
          cargo test --manifest-path daemon/Cargo.toml

      - name: Verify aarch64 cross-target compilation
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo check --target aarch64-unknown-linux-gnu --manifest-path daemon/Cargo.toml

  test-qml:
    name: QML Headless Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 QML runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-shapes \
            qml6-module-qtmultimedia \
            python3
          # Ensure qml6 command is found in PATH
          if ! command -v qml6 >/dev/null 2>&1; then
            for p in /usr/lib/qt6/bin/qml /usr/lib/qt6/bin/qml6; do
              if [ -f "$p" ]; then
                sudo ln -sf "$p" /usr/local/bin/qml6
                break
              fi
            done
          fi
          command -v qml6 || true

      - name: Run 82 QML test suites (offscreen)
        run: |
          bash tests/run_qml_tests.sh
