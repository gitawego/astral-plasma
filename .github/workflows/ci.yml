name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Rust Tests & Checks
    runs-on: ubuntu-latest
    env:
      # The runner has no Quickshell binary. The contract test reads this
      # explicit fixture version instead of treating a missing shell as 0.0.0.
      ASTRAL_TEST_QUICKSHELL_VERSION: "0.3.2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies & aarch64 cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            pulseaudio-utils \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            binutils-aarch64-linux-gnu

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Cache cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            daemon/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ci-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-

      - name: Run Rust unit tests
        run: |
          cargo test --manifest-path daemon/Cargo.toml

      - name: Verify aarch64 cross-target compilation
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: |
          cargo check --target aarch64-unknown-linux-gnu --manifest-path daemon/Cargo.toml

  test-qml:
    name: QML Headless Test Suites
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for offscreen rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libx11-xcb1 \
            libegl1 \
            libfontconfig1 \
            libdbus-1-3 \
            python3

      - name: Install Qt 6.7 (with QtQuick.Effects & QtMultimedia)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          target: 'desktop'
          modules: 'qtshadertools qtmultimedia qt5compat'
          cache: true

      - name: Verify QML runner
        run: |
          which qml
          sudo ln -sf "$(which qml)" /usr/local/bin/qml6
          qml -platform offscreen --version

      - name: Run QML test suites (offscreen)
        run: |
          bash tests/run_qml_tests.sh

  app-matrix:
    name: App Matrix (discovery)
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.discover.outputs.apps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover apps from the platform index
        id: discover
        # The matrix is read from the same index the shell reads, so a new app joins CI by
        # existing rather than by someone remembering to edit this workflow.
        run: |
          mat=$(python3 - <<'PY'
          import json
          index = json.load(open("modules/Astral/Apps/index.json"))
          apps = [{"dir": a["dir"], "id": a["id"]} for a in index["apps"]]
          print(json.dumps({"include": apps}, separators=(",", ":")))
          PY
          )
          echo "apps=$mat" >> "$GITHUB_OUTPUT"

  apps:
    name: App ${{ matrix.id }}
    needs: app-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.app-matrix.outputs.apps) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev python3

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            daemon/target/
          key: ${{ runner.os }}-cargo-apps-${{ hashFiles('daemon/Cargo.lock') }}

      - name: Build the platform CLI
        run: cargo build --manifest-path daemon/Cargo.toml

      - name: Lint ${{ matrix.dir }}
        run: ./daemon/target/debug/astral-plasma app lint "modules/Astral/Apps/${{ matrix.dir }}"

      - name: Boundary check ${{ matrix.dir }}
        run: python3 scripts/check_app_boundaries.py --app "${{ matrix.dir }}"

  platform-changed:
    name: Platform Changed (discovery)
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the platform itself changed
        # The platform is the kernel, the SDK, the host contract, and the tooling that
        # packs and installs apps. A change there deserves the full distribution check.
        id: diff
        run: |
          base="origin/${{ github.base_ref }}"
          if [ -z "${{ github.base_ref }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base"...HEAD)
          echo "$files" | head -50
          if echo "$files" | grep -qE '^(modules/Astral/Kernel|modules/Astral/AppKit|shell\.qml|daemon/src/(domain/(app_|broker|sandbox)|application/(app_|broker|preinstalled))|scripts/(gen_apps_index|check_app_boundaries)\.py|sdk/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  platform-e2e:
    name: Platform End-to-End
    needs: platform-changed
    if: needs.platform-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev python3 bubblewrap

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            daemon/target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('daemon/Cargo.lock') }}

      - name: Build the platform CLI
        run: cargo build --manifest-path daemon/Cargo.toml

      - name: API freeze gate
        run: cargo test --manifest-path daemon/Cargo.toml --test test_appkit_api

      - name: Pack, install and plan the SDK example
        # The whole distribution path, headless: the example must pack, install, and produce
        # a sandbox plan. A failure here means an app author's first hour is broken.
        run: |
          set -eu
          BIN=$PWD/daemon/target/debug/astral-plasma
          WORK=$(mktemp -d)
          export XDG_DATA_HOME="$WORK/data"
          mkdir -p "$WORK/out"
          "$BIN" app pack sdk/examples/hello --out "$WORK/out"
          "$BIN" app install "$WORK/out"/io.github.astral.hello-*.astralapp
          "$BIN" app launch io.github.astral.hello --print-command > "$WORK/plan.txt"
          grep -q -- "--unshare-all" "$WORK/plan.txt"
          grep -q -- "-p /app" "$WORK/plan.txt"
          if grep -q -- "--share-net" "$WORK/plan.txt"; then
            echo "the example declared no network permission but the plan shares the network"
            exit 1
          fi
          "$BIN" app api > /dev/null
          echo "plan:"; cat "$WORK/plan.txt"
