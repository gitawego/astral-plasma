name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rust:
    name: Rust Tests & Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install aarch64 cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Cache cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            daemon/target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      - name: Run Rust unit tests
        run: |
          cargo test --manifest-path daemon/Cargo.toml

      - name: Verify aarch64 cross-target compilation
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo check --target aarch64-unknown-linux-gnu --manifest-path daemon/Cargo.toml

  test-qml:
    name: QML Headless Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for offscreen rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libegl1 \
            libfontconfig1 \
            libdbus-1-3 \
            python3

      - name: Install Qt 6.7 (with QtQuick.Effects & QtMultimedia)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          target: 'desktop'
          modules: 'qtmultimedia qt5compat'
          cache: true

      - name: Verify QML runner
        run: |
          which qml
          qml --version || true

      - name: Run 82 QML test suites (offscreen)
        run: |
          bash tests/run_qml_tests.sh
