[package]
name = "caelestia-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "process", "sync", "time", "signal"] }
zbus = { version = "5.19", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
