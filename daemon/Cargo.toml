[package]
name = "astral-plasma"
version = "0.1.1"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "process", "sync", "time", "signal"] }
zbus = { version = "5.19", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
include_dir = "0.7.4"
cpal = "0.18.2"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "handshake"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
